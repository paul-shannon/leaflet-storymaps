   - title: Bear and Eagle Panels
     artist: Martin Oliver
     birthYear: 1946
     lat:   47.66795
     lon: -122.41799
     categories: bear, eagle
     date: 1977
     tribalAffilation: Quinault, Isleta Pueblo
     media: media/bearandeagle.jpg
     description:  Artist Marvin Oliver described how he came to create these panels:
       </p><p>“These were two of my first carvings. It was really a work that
       shows my passion. My Master’s degree was in the Northern Northwest
       Coast style, working with Bill Holm and Jacob Lawrence, and then I
       started teaching at the Universitiy of Washington in the middle
       1970s. This was a way of exploring what I’d learned, in a public
       place. It was a study. I was still learning, creating new works in
       Northwest Coast design. I was amazed by what I did. Daybreak Star
       wanted me to do the doors for their new building. And then they
       decided to put them inside so they wouldn’t wear away.”
       </p><p>Location:  The panels are on the first level of the Daybreak
       Star building in Discovery Park, 5011 Bernie Whitebear Way, Seattle,
       Wa.    </p><p>Photograph by Crisca Bierwert.  </p><p>


