   - title: Raven's Journey
     artist: Marvin Oliver
     lat: 47.65543925049407
     lon: -122.30507660704056
     categories: raven
     media: media/ravensJourney.jpg
     thumbnail: media/ravensJourney-thumb.jpg
     description:
        This sculpture was created by Marvin Oliver especially to
        honor and inspire students at the University of Washington. At
        a celebration of its installation, he said,
        <br><br>
        &quot;The canoe is a means of sharing… food, regalia, love for
        our countrymen, our environment. It is critical to make the
        canoe move. That means you need to have paddles. Those paddles
        are your education. And it takes a collective effort for your
        education.
        <br><br>
        The canoe is your journey. You’ll be pullers, and as you
        graduate you will be a skipper. You will have your family,
        your friends, and the career. Those are the ones that will
        help you make it work.
        <br><br>
        There’s days you can paddle far. There’s days you cannot
        paddle. It’s an amazing exciting venture.”
        <br><br>
        The following description of the elements in the sculpture is
        also provided by the artist, Marvin Oliver&colon;
        <br><br>
        “THE RAVEN&colon; Denotes the symbol of humor, cultural hero, and
        transformer. The Raven, like us, changes to adapt to the
        environment. I see this as similar to students’ path at the
        University,, growing, learning adapting and moving forward in
        their journey.
        <br><br>
        “THE SALMON&colon; Represents our most vital resource and provider
        of life. It is a symbol of abundance and prosperity. We honor
        the salmon and give back during the salmon ceremony.
        <br><br>
        “THE CANOE&colon; A mode of transportation, the canoe, also bonded
        extended families and was used traditionally as a burial site
        connecting us to our ancestors. This Salish design (form) is
        unique to our region.
        <br><br>
        “THE WOLF&colon; Depicts our guardian. He/she is the provider of
        food, home and spirituality, a symbol of strength in family,
        kinship and unity.
        <br><br>
        “THE MOON&colon; The protector and the guardian of the night. The
        moon protects your journey.”
        <br><br>
        Location&colon; The work is on the far south wall of the University
        of Washington Student Union Building, the “HUB,” 4001 E
        Stevens Way NE, Seattle, WA 98195.
        <br><br>
        This art was made possible by the student funding of the HUB
        renovation in 2010-2012.
        <br><br>
        Photograph by Jayna Milan.

   - title: Duwamish Longhouse Floor
     artist: Mary Lou Slaughter
     lat: 47.56119828648868
     lon:  -122.35192562279617
     categories: basketry
     media: media/duwamishLonghouseFloor.jpg
     thumbnail: media/duwamishLonghouseFloor-thumb.jpeg
     description: Basket maker Mary Lou Slaughter created the design
        for this floor at the request of the architect of the Duwamish
        Longhouse. The inlay pattern draws on her Coast Salish
        basketry designs. The zigzag pattern is the mountain design;
        the cross in the center is the sword fern design.
        <br><br>
        She says of the design, “I wasn’t thinking of the symbolism
        when I made the design. I was just thinking of the basketry
        designs. And then one day I was there at the Longhouse when
        James Rasmussen [former Duwamish tribal council member] was
        with a group and telling them about the design, explaining
        these symbols. It was amazing to hear how he put it. I guess
        it just came out when I was planning the design.”
        <br><br>
        This is how James Rasmussen explained the design, “The central
        cross, the sword fern design, signifies the Duwamish
        tribe. There are two sets of mountain designs, as the Duwamish
        are located between the two ranges of mountains, the Cascades
        and the Olympics. The sword fern is also a healing plant, and
        that is appropriate because the Duwamish are seeking
        recognition as an independent tribe, a healing process for
        descendants of the Duwamish from the time of treaty-making.”
        <br><br>
        Mary Lou Slaughter is a direct descendant of Chief Seattle,
        whose mother was Duwamish and whose father was Suquamish. She
        began to study basket-making when she was nearly 60 years old,
        working with Ed Carriere, the renown Suquamish scholar and
        maker of Coast Salish baskets. Mary Lou’s son Michael Halady
        is a carver.
        <br><br>
        Location&colon; This work is the inlaid floor of the meeting space
        at the Duwamish Longhouse, 4705 W. Marginal Way SW, Seattle,
        Wa. 98106. For hours, see the Duwamish tribe website&colon;
        https://www.duwamishtribe.org/contact/
        <br><br>
        Photograph courtesy of Mary Lou Slaughter.


   - title: Spirit of Washington
     artist: Marvin Oliver
     lat: 47.560520175429055
     lon:  -122.2872870833592
     categories: orca
     media: media/orcaDorsalFin.jpg
     thumbnail: media/orcaDorsalFin.jpg
     description: This orca dorsal fin, created by Marvin Oliver,
       carries the design of a power figure that is elaborated with
       design elements that were carved on historic Salish bowls. The
       fin is cast bronze, set on a cast rock. The orca signifies
       compassion, good luck and prosperity. The power figure on the
       fin is a human-like figure with a round face in cast glass.

   - title: Eagle Bearing Wealth
     artist: Marvin Oliver
     birthYear: 1946
     lat: 47.69918970783044
     lon:   -122.33206132860374
     categories: eagle
     date: 1988
     tribalAffilation: Quinault, Isleta Pueblo
     media: media/eaglebearingwealth.jpg
     thumbnail: media/eaglebearingwealth-thumbnail.png
     description: Artist Marvin Oliver described this carving, one
       that he designed using the Northern Northwest Coast formline
       style.</p><p>“Eagle Bearing Wealth is one of the first ones I
       did in mixed media. I added the Copper. The idea and approach,
       everything I do, comes from that now. This is where it started
       to come into play. I’m always adding something to the material,
       instead of the work just being wood. So that’s where the copper
       came in, to give it that extra dimension.”</p><p>This artwork
       is a part of the Washington State Art Collection and was
       acquired by the Washington State Arts Commission in partnership
       with North Seattle Community College.</p><p>Location - Wellness
       Center (east of Arts and Sciences building, North Seattle
       College, 9600 College Way N, Seattle, WA
       98103.</p><p>Photograph is from the Washington State Arts
       Commission, ArtsWa.</p><p>



