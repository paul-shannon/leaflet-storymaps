<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Horizontal Menu</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        
        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        /* Menu Styles */
        .horizontal-menu {
            background-color: #2c3e50;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .menu-list {
            list-style-type: none;
            display: flex;
            justify-content: center;
        }
        
        .menu-item {
            position: relative;
        }
        
        .menu-item > a {
            display: block;
            padding: 18px 24px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .menu-item:last-child > a {
            border-right: none;
        }
        
        .menu-item > a:hover {
            background-color: #3498db;
            color: white;
        }
        
        .menu-item.active > a {
            background-color: #2980b9;
        }
        
        
        /* Example Content */
        .example-content {
            background-color: #f8f9fa;
            padding: 25px;
            border-radius: 8px;
            margin-top: 20px;
        }
        
        .example-content h2 {
            color: #2c3e50;
            margin-bottom: 15px;
        }
        
        .example-content p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        
        .instructions {
            background-color: #e8f4fc;
            border-left: 4px solid #3498db;
            padding: 15px;
            margin-top: 20px;
            border-radius: 0 8px 8px 0;
        }
        
        .instructions h3 {
            color: #2c3e50;
            margin-bottom: 8px;
        }
        
        .instructions ul {
            padding-left: 20px;
            color: #444;
        }
        
        .instructions li {
            margin-bottom: 5px;
        }
        
        .code-snippet {
            background-color: #2c3e50;
            color: #ecf0f1;
            padding: 15px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            margin-top: 20px;
            overflow-x: auto;
        }
        
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>jQuery Horizontal Menu</h1>
        <p class="description">A simple horizontal menu with dropdown submenus. Hover over menu items to see the dropdown effect.</p>
        
        <nav class="horizontal-menu">
            <ul class="menu-list">
                <li class="menu-item">
                    <a href="#home">Home</a>
                </li>
                <li class="menu-item">
                    <a href="#products">Products</a>
                </li>
                <li class="menu-item">
                    <a href="#services">Services</a>
                </li>
                <li class="menu-item">
                    <a href="#about">About Us</a>
                </li>
                <li class="menu-item">
                    <a href="#contact">Contact</a>
                </li>
            </ul>
        </nav>
    </div>

    <script>
        $(document).ready(function() {
            // Add active class on menu item click
            $('.menu-item > a').click(function(e) {
                $('.menu-item').removeClass('active');
                $(this).parent().addClass('active');
                e.preventDefault();
            });
            
            // Optional: Keyboard navigation support
            $('.menu-item > a').on('keydown', function(e) {
                // Space or Enter key
                if (e.keyCode === 32 || e.keyCode === 13) {
                    $(this).click();
                }
                
                // Escape key to close submenu
                if (e.keyCode === 27) {
                    $(this).parent().removeClass('active');
                }
            });
            
            // Optional: Close submenus when clicking elsewhere
            $(document).click(function(e) {
                if (!$(e.target).closest('.menu-item').length) {
                    $('.menu-item').removeClass('active');
                }
            });
            
            // For touch devices: toggle submenu on click
            if ('ontouchstart' in window) {
                $('.menu-item').click(function(e) {
                    // Only trigger for menu items with submenus
                    if ($(this).find('.submenu').length > 0) {
                        $(this).toggleClass('active');
                        e.stopPropagation();
                    }
                });
            }
        });
    </script>
</body>
</html>
