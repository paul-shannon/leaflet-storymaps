body{
   margin: 100px;
   margin-top: 30px;
   font-family: "New York Times-Roman";
   font-size: 22px;
   height: 100%;
   }


.nav ul {
  list-style-type: none; /* Removes bullet points */
  margin: 0;
  padding: 0;
  display: flex;         /* Makes the container a flex container */
  justify-content: space-around; /* Distributes items evenly (optional) */
  background-color: #333;
}

.nav li a {
  display: block;        /* Makes links fill the list item space for a larger clickable area */
  color: white;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none; /* Removes underlines */
}

/* Change color on hover */
.nav li a:hover {
  background-color: #555;
}

</style>
